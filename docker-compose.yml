services:
  db:
    image: mysql:8
    container_name: mysql_tours
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: terranova_db
      MYSQL_USER: terranova
      MYSQL_PASSWORD: terranova
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  backend:
    build: ./backend/terranova
    container_name: backend_tours
    restart: always
    depends_on:
      - db
    env_file:
      - ./backend/terranova/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/terranova_db?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8mb4
      SPRING_DATASOURCE_USERNAME: terranova
      SPRING_DATASOURCE_PASSWORD: terranova
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      S3_BASE_URL: ${S3_BASE_URL}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: frontend_tours
    restart: always
    depends_on:
      - backend
    env_file:
      - ./backend/terranova/.env
    ports:
      - "3000:3000"

volumes:
  db_data:
