server:
  address: 0.0.0.0
  port: 8080

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB    # Tamaño máximo permitido por archivo
      max-request-size: 20MB # Tamaño máximo total de la petición
  application:
    name: terranova

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://terranova-db.czgq8m02moso.us-east-1.rds.amazonaws.com:3306/terranova_db?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&connectTimeout=30000
    username: terranova
    password: terranova
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1200000
      connection-timeout: 20000

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        connection:
          characterEncoding: UTF-8
          useUnicode: true

  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework: DEBUG
    org.hibernate: DEBUG
    com.zaxxer.hikari: DEBUG
